AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SnapScale - serverless image processing

Parameters:
  AppName:
    Type: String
    Default: snapscale
    AllowedPattern: "^[a-z0-9-]+$"

Resources:
  OriginalBucket:
    Type: AWS::S3::Bucket
    DependsOn: ProcessingQueuePolicy
    Properties:
      BucketName: !Sub "${AppName}-originals-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, POST]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt ProcessingQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AppName}-processed-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AppName}-processing-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AppName}-processing-queue"
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3

  ProcessingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProcessingQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ProcessingQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:s3:::${AppName}-originals-${AWS::AccountId}-${AWS::Region}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ImagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SnapScaleImages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: imageId
          AttributeType: S
      KeySchema:
        - AttributeName: imageId
          KeyType: HASH

  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-processor"
      CodeUri: build/processor/
      Handler: app.handler
      Runtime: python3.13
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref ImagesTable
          PROCESSED_BUCKET: !Ref ProcessedBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${OriginalBucket.Arn}/*"
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${ProcessedBucket.Arn}/*"
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt ImagesTable.Arn
      Events:
        QueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ProcessingQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  SnapScaleApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          UsagePlanName: snapscale-usage-plan
          Throttle:
            RateLimit: 5
            BurstLimit: 10
          Quota:
            Limit: 1000
            Period: DAY

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-api"
      CodeUri: src/api/
      Handler: app.handler
      Runtime: python3.13
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref ImagesTable
          ORIGINAL_BUCKET: !Ref OriginalBucket
          PROCESSED_BUCKET: !Ref ProcessedBucket
          MAX_UPLOAD_BYTES: "10485760"
          CDN_DOMAIN: !GetAtt CdnDistribution.DomainName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Scan
              Resource: !GetAtt ImagesTable.Arn
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${OriginalBucket.Arn}/uploads/*"
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${ProcessedBucket.Arn}/processed/*"
      Events:
        CreateUpload:
          Type: Api
          Properties:
            RestApiId: !Ref SnapScaleApi
            Path: /uploads
            Method: post
        ListImages:
          Type: Api
          Properties:
            RestApiId: !Ref SnapScaleApi
            Path: /images
            Method: get
        GetImage:
          Type: Api
          Properties:
            RestApiId: !Ref SnapScaleApi
            Path: /images/{imageId}
            Method: get
        GetVariants:
          Type: Api
          Properties:
            RestApiId: !Ref SnapScaleApi
            Path: /images/{imageId}/variants
            Method: get

  CdnOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AppName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CdnDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: SnapScale processed images
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: processed-s3
            DomainName: !GetAtt ProcessedBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt CdnOac.Id
        DefaultCacheBehavior:
          TargetOriginId: processed-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  ProcessedBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProcessedBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${ProcessedBucket.Arn}/processed/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CdnDistribution}"
                
  OriginalBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OriginalBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt OriginalBucket.Arn
              - !Sub "${OriginalBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AppName}-alerts"

  ImagesProcessedFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: ProcessorFunction
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-processor"
      FilterPattern: '"image_processed"'
      MetricTransformations:
        - MetricNamespace: SnapScale
          MetricName: ImagesProcessed
          MetricValue: "1"
          DefaultValue: 0

  ImagesRejectedFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: ProcessorFunction
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-processor"
      FilterPattern: '"Rejected"'
      MetricTransformations:
        - MetricNamespace: SnapScale
          MetricName: ImagesRejected
          MetricValue: "1"
          DefaultValue: 0

  ProcessingFailuresFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: ProcessorFunction
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-processor"
      FilterPattern: '"Message failed"'
      MetricTransformations:
        - MetricNamespace: SnapScale
          MetricName: ProcessingFailures
          MetricValue: "1"
          DefaultValue: 0

  DlqNotEmptyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-dlq-not-empty"
      AlarmDescription: A job failed 3 times and landed in the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  ProcessingFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-processing-failures"
      AlarmDescription: The processor raised an error while handling a job
      Namespace: SnapScale
      MetricName: ProcessingFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  ProcessorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-processor-lambda-errors"
      AlarmDescription: The processor Lambda crashed or timed out
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-api-lambda-errors"
      AlarmDescription: The API Lambda crashed or timed out
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  QueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-queue-backlog"
      AlarmDescription: A job has waited in the queue for over 10 minutes
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ProcessingQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 600
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  OverviewDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AppName}-overview"
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Images processed / rejected / failed","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["SnapScale","ImagesProcessed"],["SnapScale","ImagesRejected"],["SnapScale","ProcessingFailures"]]}},
            {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Processor duration (ms)","region":"${AWS::Region}","stat":"Average","period":300,"metrics":[["AWS/Lambda","Duration","FunctionName","${ProcessorFunction}"]]}},
            {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Queue depth (main and dead-letter)","region":"${AWS::Region}","stat":"Maximum","period":60,"metrics":[["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${ProcessingQueue.QueueName}"],["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${DeadLetterQueue.QueueName}"]]}},
            {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Lambda errors","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/Lambda","Errors","FunctionName","${ProcessorFunction}"],["AWS/Lambda","Errors","FunctionName","${ApiFunction}"]]}}
          ]
        }

Outputs:
  OriginalBucketName:
    Value: !Ref OriginalBucket
  ProcessedBucketName:
    Value: !Ref ProcessedBucket
  ProcessingQueueUrl:
    Value: !Ref ProcessingQueue
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  ImagesTableName:
    Value: !Ref ImagesTable
  ProcessorFunctionName:
    Value: !Ref ProcessorFunction
  ApiUrl:
    Value: !Sub "https://${SnapScaleApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  ApiFunctionName:
    Value: !Ref ApiFunction
  CdnDomain:
    Value: !GetAtt CdnDistribution.DomainName
  AlertTopicArn:
    Value: !Ref AlertTopic
  DashboardName:
    Value: !Ref OverviewDashboard